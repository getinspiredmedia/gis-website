<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit your work · Get Inspired Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0d2ec4;--ink:#0b0c10;--paper:#ffffff;--muted:#5b616b;--line:#e4e6ec;--ease:cubic-bezier(.16,.84,.44,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',-apple-system,sans-serif;background:var(--paper);color:var(--ink);min-height:100svh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:clamp(80px,14vh,140px) 24px 80px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:14px}
h1{font-weight:700;font-size:clamp(2.2rem,5.4vw,3.8rem);line-height:.96;letter-spacing:-.02em;font-variation-settings:'wdth' 116;margin-bottom:14px}
.sub{font-size:16px;color:var(--muted);margin-bottom:40px;line-height:1.55;max-width:38ch}
.field{display:block;margin-bottom:22px}
.field span{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.field input,.field textarea{width:100%;background:var(--paper);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:16px 18px;border-radius:2px;transition:border-color .2s}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--ink)}
.field textarea{min-height:100px;resize:vertical;line-height:1.55}
.drop{border:1px dashed var(--line);border-radius:2px;padding:40px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.drop:hover,.drop.over{border-color:var(--ink);background:#fafafa}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .drop-icon{font-size:28px;line-height:1;margin-bottom:10px}
.drop .drop-label{font-size:14px;color:var(--muted)}
.drop .drop-label b{color:var(--ink)}
.drop .drop-hint{margin-top:5px;font-size:12px;color:#aaa}
.preview{margin-top:14px;display:none}
.preview img{max-width:100%;max-height:220px;object-fit:contain;border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px 32px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:background .25s,gap .25s;margin-top:8px}
.btn:hover{background:#1038d8;gap:16px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.msg{margin-top:18px;font-size:14px;line-height:1.55;display:none}
.msg.err{color:#991b1b}
#state-done{display:none;text-align:center;padding:80px 0}
#state-done h2{font-size:clamp(2rem,4.4vw,3rem);font-weight:700;letter-spacing:-.02em;font-variation-settings:'wdth' 114;line-height:1.04}
#state-done p{margin-top:16px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div id="state-form">
    <span class="eyebrow">Get Inspired Society &nbsp;<span style="font-weight:400;opacity:.55">On View</span></span>
    <h1>Put your work forward.</h1>
    <p class="sub">One image, one title. We review everything ourselves.</p>

    <form id="form" novalidate>
      <label class="field">
        <span>Your name</span>
        <input id="name" type="text" placeholder="First and last name" autocomplete="name" required>
      </label>
      <label class="field">
        <span>Your email</span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Title of the work</span>
        <input id="work_title" type="text" placeholder="Untitled" required>
      </label>
      <div class="field">
        <span>The image</span>
        <div class="drop" id="drop">
          <input type="file" id="file" accept="image/jpeg,image/png,image/webp" required>
          <div class="drop-icon">⬆</div>
          <p class="drop-label"><b>Click to choose</b> or drag and drop</p>
          <p class="drop-hint">JPEG, PNG or WebP · max 20 MB</p>
        </div>
        <div class="preview" id="preview"><img id="preview-img" src="" alt="Preview"></div>
      </div>
      <button class="btn" type="submit" id="submit-btn">Submit →</button>
      <p class="msg" id="msg"></p>
    </form>
  </div>

  <div id="state-done">
    <h2>Thank you.</h2>
    <p>We have received your work.<br>We'll be in touch.</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  var form      = document.getElementById('form');
  var submitBtn = document.getElementById('submit-btn');
  var msg       = document.getElementById('msg');
  var stateDone = document.getElementById('state-done');
  var stateForm = document.getElementById('state-form');
  var fileInput = document.getElementById('file');
  var drop      = document.getElementById('drop');
  var preview   = document.getElementById('preview');
  var previewImg= document.getElementById('preview-img');

  fileInput.addEventListener('change', function () {
    var file = fileInput.files[0];
    if (!file) { preview.style.display = 'none'; return; }
    previewImg.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('over');
    var file = e.dataTransfer.files[0];
    if (file && /^image\/(jpeg|png|webp)$/.test(file.type)) {
      var dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = '';
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name       = document.getElementById('name').value.trim();
    var email      = document.getElementById('email').value.trim();
    var work_title = document.getElementById('work_title').value.trim();
    var file       = fileInput.files[0];
    msg.style.display = 'none';
    if (!name)       { showMsg('Please enter your name.'); return; }
    if (!email)      { showMsg('Please enter your email.'); return; }
    if (!work_title) { showMsg('Please enter a title.'); return; }
    if (!file)       { showMsg('Please select an image.'); return; }

    var fd = new FormData();
    fd.append('name', name);
    fd.append('email', email);
    fd.append('work_title', work_title);
    fd.append('image', file);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    fetch('/api/submit', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          stateForm.style.display = 'none';
          stateDone.style.display = 'block';
        } else {
          showMsg(data.error || 'Something went wrong.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit →';
        }
      })
      .catch(function () {
        showMsg('Could not reach the server. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit →';
      });
  });

  function showMsg(text) {
    msg.textContent = text;
    msg.className = 'msg err';
    msg.style.display = '';
  }
}());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On View — Get Inspired Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
:root {
  --blue: #0d2ec4;
  --ink: #0b0c10;
  --wall: #111319;
  --band: #0f1118;
  --paper: #ffffff;
  --muted: #5b616b;
  --line: #e4e6ec;
  --ease: cubic-bezier(.16,.84,.44,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Archivo', -apple-system, sans-serif;
  background: var(--wall);
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

/* ── Wall ── */
.wall {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-color: var(--band);
  opacity: 0;
  transition: opacity .45s var(--ease);
  z-index: 0;
}
.wall.visible { opacity: 1; }
.wall::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(11,12,16,.65) 0%, transparent 45%);
  pointer-events: none;
}

/* ── Nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid transparent;transition:transform .45s var(--ease),background .35s,border-color .35s,padding .35s var(--ease)}
nav.solid{background:var(--ink);border-bottom-color:rgba(255,255,255,.14);padding:8px 22px}
nav.hide{transform:translateY(-102%)}
nav .mark{height:clamp(52px,9vw,88px);transition:height .4s var(--ease),width .4s var(--ease)}
nav.solid .mark{height:clamp(30px,4vw,40px);width:auto}
nav:not(.solid) .mark-dark{filter:invert(1)}
.menu{display:flex;gap:4px;align-items:center}
.menu a{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:9px 13px;border-radius:999px;line-height:1;transition:background .25s,color .25s}
.menu a:hover,.menu a:focus-visible,.menu a[aria-current]{background:rgba(255,255,255,.16)}
.menu .enter{background:var(--blue);padding:10px 18px;margin-left:12px}
.menu .enter:hover,.menu .enter:focus-visible{background:#fff;color:var(--blue)}

/* ── Mobile nav toggle ── */
.nav-toggle{display:none;position:relative;z-index:2;width:40px;height:40px;flex-shrink:0;border:0;background:transparent;color:#fff;cursor:pointer;align-items:center;justify-content:center}
.nav-toggle span{position:relative;display:block;width:22px;height:2px;background:currentColor;transition:background .2s var(--ease)}
.nav-toggle span::before,.nav-toggle span::after{content:'';position:absolute;left:0;width:22px;height:2px;background:currentColor;transition:transform .3s var(--ease)}
.nav-toggle span::before{top:-7px}
.nav-toggle span::after{top:7px}
.nav-toggle:focus-visible{outline:2px solid currentColor;outline-offset:3px}

@media(max-width:860px){
  .nav-toggle{display:flex}
  nav .mark{height:40px!important;width:auto!important}
  nav>a{position:relative;z-index:2}
  .menu{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    gap:6px;padding:32px;
    background:var(--ink);
    transform:translateY(-100%);
    opacity:0;
    transition:transform .4s var(--ease),opacity .35s var(--ease);
    pointer-events:none;
  }
  nav.nav-open{background:var(--ink);border-bottom-color:transparent}
  nav.nav-open.hide{transform:none}
  nav.nav-open .menu{transform:translateY(0);opacity:1;pointer-events:auto}
  .menu a{
    color:#fff;
    background:none;
    font-size:clamp(1.7rem,8vw,2.6rem);
    font-weight:700;
    letter-spacing:-.02em;
    font-variation-settings:'wdth' 116;
    text-transform:none;
    padding:9px 0;
    border-radius:0;
    line-height:1.15;
  }
  .menu a:hover,.menu a:focus-visible,.menu a[aria-current]{background:none;color:rgba(255,255,255,.6)}
  .menu .enter{
    display:inline-flex;
    margin:22px 0 0;
    background:var(--blue);
    color:#fff;
    font-size:13px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:13px 26px;
    border-radius:999px;
  }
  .menu .enter:hover,.menu .enter:focus-visible{background:#fff;color:var(--blue)}
  nav.nav-open .mark{filter:none}
  nav.nav-open .nav-toggle{color:#fff}
}
@media(prefers-reduced-motion:reduce){
  .menu{transition:none}
  .nav-toggle span::before,.nav-toggle span::after{transition:none}
}
/* ── Wipe ── */
#wipe{position:fixed;inset:0;background:var(--blue);z-index:200;transform:scaleY(0);transform-origin:bottom;pointer-events:none}
#wipe.go{animation:wipe 900ms var(--ease) forwards}
@keyframes wipe{0%{transform:scaleY(0);transform-origin:bottom}45%{transform:scaleY(1);transform-origin:bottom}55%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(0);transform-origin:top}}

/* ── Arrows ── */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 90;
  background: transparent;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50%;
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: background .25s var(--ease), border-color .25s var(--ease);
  line-height: 1;
}
.arrow:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.65); }
.arrow:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.arrow-prev { left: 24px; }
.arrow-next { right: 24px; }

/* ── Plaque — exact tokens from design-system.html ── */
.plaque {
  position: fixed;
  bottom: 28px;
  left: 32px;
  z-index: 90;
}
.plaque .pt {
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -.01em;
  text-decoration: none;
  color: #fff;
  display: block;
}
.plaque .pt:hover { text-decoration: underline; }
.plaque .pa { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.72); }
.plaque .pp {
  display: inline-block;
  margin-top: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
  border-bottom: 1px solid rgba(255,255,255,.28);
  padding-bottom: 3px;
  text-decoration: none;
  transition: color .25s, border-color .25s;
}
.plaque .pp:hover { color: rgba(255,255,255,.9); border-color: rgba(255,255,255,.6); }
.plaque .pp:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ── Progress — fixed at foot of screen ── */
.progress {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: rgba(255,255,255,.16);
  z-index: 90;
}
.progress-fill {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
}
.progress-fill.animate {
  animation: progress-fill 20s linear forwards;
}
@keyframes progress-fill { to { width: 100%; } }

/* ── Page scaffold: spacer so content below wall is reachable ── */
.viewport-spacer { height: 100vh; pointer-events: none; }

/* ── Statement section ── */
.statement-section {
  background: var(--blue);
  color: #fff;
  padding: 80px 24px;
  text-align: center;
  overflow: hidden;
}
.stmt-inner { max-width: 900px; margin: 0 auto; }
.stmt-line {
  font-weight: 700;
  font-size: clamp(2.4rem, 6.6vw, 5.6rem);
  line-height: .94;
  letter-spacing: -.02em;
  font-variation-settings: 'wdth' 118;
}

/* ── Footer ── */
footer {
  background: var(--ink);
  color: rgba(255,255,255,.4);
  padding: 40px 24px;
  text-align: center;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .wall { transition: none; }
  .progress-fill.animate { animation: none; width: 100%; }
}
</style>
</head>
<body>

<div id="wipe"></div>
<nav>
  <a href="/" aria-label="Get Inspired Society, home"><img class="mark" src="/assets/mark.png" alt="Get Inspired Society" width="110" height="88"></a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
    <span></span>
  </button>
  <div class="menu" id="site-menu">
    <a data-nav="magazine" href="/magazine">Magazine</a>
    <a data-nav="gallery" href="/gallery">Gallery</a>
    <a data-nav="society" href="/society">Society</a>
    <a class="enter" href="https://society.getinspiredsociety.com">Log in</a>
  </div>
</nav>

<div class="wall" id="wall" aria-hidden="true"></div>

<button class="arrow arrow-prev" id="btn-prev" aria-label="Previous work" style="display:none">&#8592;</button>
<button class="arrow arrow-next" id="btn-next" aria-label="Next work" style="display:none">&#8594;</button>

<div class="plaque" id="plaque">
  <a class="pt" id="plaque-title" href="#">&nbsp;</a>
  <p class="pa" id="plaque-artist"></p>
  <a class="pp" id="plaque-portfolio" href="#" target="_blank" rel="noopener">Portfolio</a>
</div>

<div class="progress" role="progressbar" aria-label="Time remaining">
  <span class="progress-fill" id="progress-fill"></span>
</div>

<div class="viewport-spacer"></div>

<section class="statement-section" aria-label="Statement">
  <div class="stmt-inner">
    <p class="stmt-line">Chosen, not counted.</p>
  </div>
</section>

<footer>Get Inspired Society &middot; On View</footer>

<script>
(function () {
  'use strict';

  var CYCLE_MS = 20000;
  var FADE_MS  = 450;

  var wall          = document.getElementById('wall');
  var plaqueTitle   = document.getElementById('plaque-title');
  var plaqueArtist  = document.getElementById('plaque-artist');
  var plaquePortfolio = document.getElementById('plaque-portfolio');
  var progressFill  = document.getElementById('progress-fill');
  var btnPrev       = document.getElementById('btn-prev');
  var btnNext       = document.getElementById('btn-next');

  var works    = [];
  var shuffled = [];
  var pos      = 0;
  var timer    = null;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ── Shuffle bag ── */
  function buildShuffled() {
    shuffled = works.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    pos = 0;
  }

  function currentWork() { return shuffled[pos]; }

  function advance() {
    pos++;
    if (pos >= shuffled.length) buildShuffled();
  }

  function retreat() {
    if (pos > 0) pos--;
  }

  /* ── Progress bar ── */
  function resetProgress() {
    progressFill.classList.remove('animate');
    void progressFill.offsetWidth; /* reflow */
    if (!reduceMotion.matches) {
      progressFill.classList.add('animate');
    }
  }

  /* ── Nav mark colour adaptation ── */
  function adaptNavMark(imgEl) {
    try {
      var mark = document.querySelector('nav .mark');
      if (!mark) return;
      var vw = innerWidth, vh = innerHeight;
      var sw = 160, sh = 120;
      var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
      if (!iw || !ih) return;
      var scale = Math.max(vw / iw, vh / ih);
      var c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      var ctx = c.getContext('2d');
      ctx.drawImage(imgEl, (vw - iw * scale) / 2, (vh - ih * scale) / 2, iw * scale, ih * scale);
      var d = ctx.getImageData(0, 0, sw, sh).data;
      var lum = 0, n = d.length / 4;
      for (var i = 0; i < d.length; i += 4) lum += 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      mark.classList.toggle('mark-dark', (lum / n) > 128);
    } catch(e) { /* CORS of andere fout — behoud wit standaard */ }
  }

  function sampleImage(url) {
    try {
      var img = new Image();
      img.onload = function() { adaptNavMark(img); };
      img.src = url;
    } catch(e) {}
  }

  /* ── Preload next image ── */
  function preload(work) {
    if (!work) return;
    var img = new Image();
    img.src = work.image;
  }

  /* ── Show work ── */
  function showWork(work) {
    if (reduceMotion.matches) {
      wall.style.backgroundImage = 'url(\'' + work.image + '\')';
      wall.classList.add('visible');
      updatePlaque(work);
      resetProgress();
      var next = shuffled[pos + 1] || shuffled[0];
      preload(next);
      sampleImage(work.image);
      return;
    }

    wall.classList.remove('visible');
    setTimeout(function () {
      wall.style.backgroundImage = 'url(\'' + work.image + '\')';
      wall.classList.add('visible');
      updatePlaque(work);
      resetProgress();
      var next = shuffled[(pos) % shuffled.length];
      preload(next);
      sampleImage(work.image);
    }, FADE_MS + 50);
  }

  function updatePlaque(work) {
    plaqueTitle.textContent = work.title;
    plaqueTitle.href = '/work/' + work.slug;
    plaqueArtist.textContent = work.artist;
    plaquePortfolio.href = work.portfolio;
  }

  /* ── Auto-rotation ── */
  function startTimer() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      advance();
      showWork(currentWork());
      startTimer();
    }, CYCLE_MS);
  }

  function stopTimer() {
    clearTimeout(timer);
    timer = null;
  }

  /* ── Arrow visibility ── */
  function updateArrows() {
    var show = works.length >= 2;
    btnPrev.style.display = show ? '' : 'none';
    btnNext.style.display = show ? '' : 'none';
  }

  /* ── Controls ── */
  btnNext.addEventListener('click', function () {
    stopTimer();
    advance();
    showWork(currentWork());
    if (!reduceMotion.matches) startTimer();
  });

  btnPrev.addEventListener('click', function () {
    stopTimer();
    retreat();
    showWork(currentWork());
    if (!reduceMotion.matches) startTimer();
  });

  /* ── Respond to system motion preference changes ── */
  reduceMotion.addEventListener('change', function (e) {
    if (e.matches) {
      stopTimer();
      progressFill.classList.remove('animate');
    } else {
      resetProgress();
      startTimer();
    }
  });

  /* ── Keyboard navigation ── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { btnPrev.click(); }
    if (e.key === 'ArrowRight') { btnNext.click(); }
  });

  /* ── Fallback ─────────────────────────────────────────────────────────────
     Shown when the normal works-set is empty or unreachable.
     Fetches /work/maasvlakte by slug regardless of its archived status.
     Kept as a separate code-path so changes to the shuffle-bag never affect it.
  ── */
  var FALLBACK_SLUG = 'maasvlakte';

  function showFallback() {
    fetch('/api/works/' + FALLBACK_SLUG)
      .then(function (r) { return r.json(); })
      .then(function (work) {
        if (!work || work.error) {
          plaqueTitle.textContent = 'Nothing on the wall right now.';
          plaqueArtist.textContent = '';
          return;
        }
        // Put fallback into works so prev/next/timer still function (loop of 1)
        works = [work];
        buildShuffled();
        updateArrows();
        showWork(currentWork());
        if (!reduceMotion.matches) startTimer();
      })
      .catch(function () {
        plaqueTitle.textContent = 'Nothing on the wall right now.';
        plaqueArtist.textContent = '';
      });
  }

  /* ── Boot ── */
  fetch('/api/works')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.length) { showFallback(); return; }
      works = data;
      buildShuffled();
      updateArrows();
      // Move the "current" work to the front so it always shows first on load
      var curIdx = shuffled.findIndex(function (w) { return w.current; });
      if (curIdx > 0) { shuffled.unshift(shuffled.splice(curIdx, 1)[0]); pos = 0; }
      showWork(currentWork());
      if (!reduceMotion.matches) startTimer();
    })
    .catch(showFallback);
}());
</script>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wipeEl = document.getElementById('wipe');
  document.addEventListener('DOMContentLoaded', function(){
    var navEl = document.querySelector('nav');
    if(navEl){
      var lastY = scrollY;
      function onScroll(){
        var y = scrollY;
        navEl.classList.toggle('solid', y > 40);
        navEl.classList.toggle('hide', y > innerHeight*0.7 && y > lastY);
        lastY = y;
      }
      onScroll();
      addEventListener('scroll', onScroll, {passive:true});
    }
    if(wipeEl){
      document.querySelectorAll('a[href^="/"]').forEach(function(a){
        a.addEventListener('click', function(ev){
          if(reduce) return;
          ev.preventDefault();
          wipeEl.classList.add('go');
          setTimeout(function(){ location.href = a.getAttribute('href'); }, 430);
        });
      });
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var nav    = document.querySelector('nav');
  var toggle = nav && nav.querySelector('.nav-toggle');
  var menu   = document.getElementById('site-menu');
  if (!nav || !toggle || !menu) return;

  function isOpen() { return nav.classList.contains('nav-open'); }

  function open() {
    nav.classList.add('nav-open');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Close menu');
    document.body.style.overflow = 'hidden';
    var first = menu.querySelector('a');
    if (first) first.focus();
  }

  function close(returnFocus) {
    nav.classList.remove('nav-open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open menu');
    document.body.style.overflow = '';
    if (returnFocus) toggle.focus();
  }

  toggle.addEventListener('click', function () {
    if (isOpen()) close(true); else open();
  });

  menu.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') close(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) close(true);
  });

  addEventListener('resize', function () {
    if (innerWidth > 860 && isOpen()) close(false);
  });
}());
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — Get Inspired Society</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

<style>
:root {
  --blue: #0d2ec4;
  --ink: #0b0c10;
  --wall: #111319;
  --band: #0f1118;
  --paper: #ffffff;
  --muted: #5b616b;
  --line: #e4e6ec;
  --ease: cubic-bezier(.16,.84,.44,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Archivo', -apple-system, sans-serif;
  background: var(--ink);
  color: #fff;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

/* ── Masthead ── */
.masthead {
  height: 56px;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.masthead-wordmark {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-decoration: none;
  color: #fff;
}
.masthead-nav { display: flex; align-items: center; gap: 4px; }
.menuitem {
  display: inline-flex;
  border-radius: 999px;
  padding: 9px 13px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration: none;
  color: #fff;
  transition: background .25s;
}
.menuitem:hover { background: rgba(255,255,255,.16); }
.menuitem:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ── Main layout ── */
main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 64px 24px 96px;
}

/* ── Back link ── */
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(255,255,255,.45);
  text-decoration: none;
  margin-bottom: 48px;
  transition: color .25s;
}
.back:hover { color: rgba(255,255,255,.9); }
.back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ── Work image ── */
.work-image {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--band) center/cover no-repeat;
  margin-bottom: 40px;
}

/* ── Status eyebrow ── */
.status {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.status.on-view  { color: var(--blue); }
.status.off-view { color: var(--muted); }

/* ── Work title ── */
.work-title {
  font-weight: 700;
  font-size: clamp(2.2rem, 5.4vw, 4.4rem);
  line-height: .96;
  letter-spacing: -.02em;
  font-variation-settings: 'wdth' 116;
  margin-bottom: 16px;
}

/* ── Artist ── */
.work-artist {
  font-size: 1.2rem;
  color: rgba(255,255,255,.72);
  margin-bottom: 36px;
}

/* ── Button — outlined pill, on ink ground ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid currentColor;
  border-radius: 999px;
  padding: 13px 24px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  text-decoration: none;
  color: #fff;
  transition: background .3s, color .3s, gap .3s;
}
.btn:hover { background: #fff; color: var(--ink); gap: 16px; }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ── Not found state ── */
.not-found {
  padding: 80px 0;
  color: var(--muted);
}
.not-found h1 {
  font-size: clamp(2.2rem, 5.4vw, 4.4rem);
  font-weight: 700;
  line-height: .96;
  font-variation-settings: 'wdth' 116;
  color: #fff;
  margin-bottom: 16px;
}

/* ── Footer ── */
footer {
  background: var(--ink);
  color: rgba(255,255,255,.4);
  padding: 40px 24px;
  text-align: center;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  border-top: 1px solid rgba(255,255,255,.08);
}

/* ── Reveal animation ── */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .9s var(--ease), transform .9s var(--ease);
}
.reveal.visible {
  opacity: 1;
  transform: none;
}
@media (prefers-reduced-motion: reduce) {
  .reveal { transition: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>

<nav class="masthead">
  <a class="masthead-wordmark" href="/">Get Inspired Society</a>
  <div class="masthead-nav">
    <a class="menuitem" href="/on-view">On View</a>
    <a class="menuitem" href="/magazine">Magazine</a>
    <a class="menuitem" href="/gallery">Gallery</a>
    <a class="menuitem" href="/society">Society</a>
  </div>
</nav>

<main id="main">
  <a class="back" href="/on-view">&#8592; On View</a>
  <div id="content"></div>
</main>

<footer>Get Inspired Society &middot; On View</footer>

<script>
(function () {
  'use strict';

  var content = document.getElementById('content');

  /* Read slug from URL: /work/<slug> */
  var parts = window.location.pathname.split('/').filter(Boolean);
  var slug  = parts[1] || '';

  function setTitle(t) { document.title = t + ' — Get Inspired Society'; }

  function renderWork(work) {
    setTitle(work.title);

    var statusClass  = work.current ? 'on-view'  : 'off-view';
    var statusLabel  = work.current ? 'Currently on view' : 'Previously on view';
    var portfolioHTML = work.portfolio && work.portfolio !== '#'
      ? '<a class="btn" href="' + esc(work.portfolio) + '" target="_blank" rel="noopener">Portfolio &rarr;</a>'
      : '';

    content.innerHTML =
      '<div class="work-image reveal" id="img" style="background-image:url(\'' + esc(work.image) + '\')" role="img" aria-label="' + esc(work.title) + ' by ' + esc(work.artist) + '"></div>' +
      '<p class="status ' + statusClass + ' reveal">' + esc(statusLabel) + '</p>' +
      '<h1 class="work-title reveal">' + esc(work.title) + '</h1>' +
      '<p class="work-artist reveal">' + esc(work.artist) + '</p>' +
      (portfolioHTML ? '<div class="reveal">' + portfolioHTML + '</div>' : '');

    /* Trigger reveal animation */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var els = content.querySelectorAll('.reveal');
        var delay = 0;
        els.forEach(function (el) {
          setTimeout(function () { el.classList.add('visible'); }, delay);
          delay += 80;
        });
      });
    });
  }

  function renderNotFound() {
    setTitle('Work not found');
    content.innerHTML =
      '<div class="not-found">' +
      '<h1>Work not found.</h1>' +
      '<p style="color:var(--muted);font-size:15px;margin-top:12px">No work with this address exists in the current set.</p>' +
      '<div style="margin-top:32px"><a class="btn" href="/on-view">Back to On View &rarr;</a></div>' +
      '</div>';
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  if (!slug) { renderNotFound(); return; }

  fetch('/api/works/' + encodeURIComponent(slug))
    .then(function (r) {
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function (work) {
      renderWork(work);
    })
    .catch(function () {
      renderNotFound();
    });
}());
</script>

</body>
</html>

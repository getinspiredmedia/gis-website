<!--
  ARCHIVED, NOT PART OF THE BUILD.

  The homepage hero that showed the current selection of On View: a
  full-screen plate of the work with status "current" (from GET /api/works),
  with a caption (artist, title, portfolio link). It was replaced by the
  temporary open-call hero. build/build.js only reads the partials it names
  (nav, footer, wipe, analytics), so nothing in this directory is built.

  Note: this hero was never an iframe/embed and has no postMessage link; it is
  a plain <section class="open"> filled by inline JS.

  To restore, in build/pages/index.html:
    1. Replace the open-call hero markup (<section class="callout">) with
       the MARKUP block below.
    2. Add the CSS block below to the <style> (and the reduced-motion lines).
    3. Add the adaptNavMark() function and the JS block below to the inline
       script, and call renderHero(cur) again in the fetch handler
       (the handler currently no longer finds `cur`, see the comment there).
    4. Remove the open-call CSS/markup/script.
  Then run `npm run build`.
-->

<!-- ================= CSS ================= -->
<style>
/* cold open */
.open{position:relative;height:100svh;min-height:560px;background:var(--ink);overflow:hidden;display:flex;align-items:flex-end}
.open figure{position:absolute;inset:0}
.open .plate{width:100%;height:100%;background:radial-gradient(120% 90% at 62% 34%,#2a3550 0%,#14161f 55%,#0b0c10 100%);transform:scale(1.06);opacity:0;animation:plateIn 2600ms var(--ease) forwards}
@keyframes plateIn{to{transform:scale(1);opacity:1}}
.open .veil{position:absolute;inset:0;background:var(--ink);transform-origin:top;animation:veil 1200ms var(--ease) 300ms forwards}
@keyframes veil{to{transform:scaleY(0)}}
.open .caption{position:relative;z-index:2;color:#fff;padding:0 28px 34px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;opacity:0;animation:fadeUp 900ms var(--ease) 1900ms forwards}
.open .caption .eyebrow{color:#fff;opacity:.72}
.open .caption h1{font-size:clamp(1.4rem,3vw,2.4rem);font-weight:600;letter-spacing:-.01em;margin-top:8px;font-variation-settings:'wdth' 108}
.open .caption .meta{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-pp{display:inline-block;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.28);padding-bottom:3px;text-decoration:none;transition:color .25s,border-color .25s}
.hero-pp:hover{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.6)}

/* inside @media(prefers-reduced-motion:reduce) */
/*   .open .plate{opacity:1;transform:none}   */
/*   .open .caption{opacity:1}                */
</style>

<!-- ================= MARKUP ================= -->
<section class="open">
  <figure><div class="plate" id="hero-plate"></div></figure>
  <div class="veil"></div>
  <div class="caption">
    <div>
      <span class="eyebrow" id="hero-label">On view</span>
      <h1 id="hero-artist">&nbsp;</h1>
      <a class="hero-pp" id="hero-portfolio" href="#" target="_blank" rel="noopener" style="display:none">Portfolio</a>
    </div>
    <div class="meta" id="hero-meta"></div>
  </div>
</section>

<!-- ================= JS ================= -->
<script>
// Nav mark colour follows the brightness of the hero image.
function adaptNavMark(imgEl) {
  try {
    var mark = document.querySelector('nav .mark');
    if (!mark) return;
    var vw = innerWidth, vh = innerHeight;
    var sw = 160, sh = 120;
    var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
    if (!iw || !ih) return;
    var scale = Math.max(vw / iw, vh / ih);
    var c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    var ctx = c.getContext('2d');
    ctx.drawImage(imgEl, (vw - iw * scale) / 2, (vh - ih * scale) / 2, iw * scale, ih * scale);
    var d = ctx.getImageData(0, 0, sw, sh).data;
    var lum = 0, n = d.length / 4;
    for (var i = 0; i < d.length; i += 4) lum += 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    mark.classList.toggle('mark-dark', (lum / n) > 128);
  } catch(e) { /* CORS of andere fout — behoud wit standaard */ }
}

// Inside the "Dynamic hero + previous grid" IIFE:
  var heroLabel   = document.getElementById('hero-label');
  var heroArtist  = document.getElementById('hero-artist');
  var heroMeta    = document.getElementById('hero-meta');
  var heroPlate   = document.getElementById('hero-plate');

  function renderHero(w) {
    if (!w) return;
    if (heroLabel)  heroLabel.textContent  = 'On view';
    if (heroArtist) heroArtist.textContent = w.artist || '';
    if (heroMeta)   heroMeta.textContent   = (w.title && w.title !== w.artist) ? w.title : '';
    var pp = document.getElementById('hero-portfolio');
    if (pp) {
      if (w.portfolio && w.portfolio !== '#') {
        pp.href = w.portfolio;
        pp.style.display = '';
      } else {
        pp.style.display = 'none';
      }
    }
    if (heroPlate && w.image) {
      var img = new Image();
      img.onload = function() {
        heroPlate.style.backgroundImage    = "url('" + w.image.replace(/'/g,'%27') + "')";
        heroPlate.style.backgroundSize     = 'cover';
        heroPlate.style.backgroundPosition = 'center';
        adaptNavMark(img);
      };
      img.src = w.image;
    }
    try { sessionStorage.setItem('gis_hero', JSON.stringify({artist:w.artist,title:w.title,image:w.image,slug:w.slug,portfolio:w.portfolio})); } catch(e){}
  }

  try {
    var cached = sessionStorage.getItem('gis_hero');
    if (cached) renderHero(JSON.parse(cached));
  } catch(e){}

// And in the fetch('/api/works') handler:
//   var cur  = data.find(function(w){ return w.current; });
//   if (cur) renderHero(cur);
</script>

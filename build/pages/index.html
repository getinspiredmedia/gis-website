<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Inspired Society</title>
<meta name="description" content="Get Inspired Society: an independent visual arts magazine and exhibition platform. Four issues a year, five artists an issue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking font load, same pattern as build/pages/submit.html. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap"></noscript>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<!-- @include: analytics -->
<style>
/* Opt in to the browser's native cross-document View Transition on internal
   navigation. Unsupported browsers ignore this at-rule entirely and simply
   navigate as normal; public/js/motion.js detects that case (and reduced
   motion) and runs the block wipe instead, so the two never fight. */
@view-transition { navigation: auto; }

:root{--blue:#0d2ec4;--ink:#0b0c10;--paper:#ffffff;--band:#0f1118;--muted:#5b616b;--line:#e4e6ec;--ease:cubic-bezier(.16,.84,.44,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
/* Fallback metrics copied from Archivo's own hhea table (ascent/descent/line-gap) and from its xAvgCharWidth vs Arial/Liberation Sans (size-adjust), so swapping in the real webfont doesn't reflow the page (CLS). */
@font-face{font-family:'Archivo Fallback';src:local('Arial'),local('Helvetica'),local('Liberation Sans'),local('Helvetica Neue');size-adjust:99.2%;ascent-override:87.8%;descent-override:21%;line-gap-override:0%}
body{font-family:'Archivo','Archivo Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.statement{font-weight:700;line-height:.94;letter-spacing:-.02em;font-variation-settings:'wdth' 118;font-size:clamp(2.6rem,7.4vw,6.6rem)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.is-in{opacity:1;transform:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}

/* ── Statement ── */
.claim{background:var(--blue);color:#fff;padding:clamp(80px,14vh,180px) 28px;display:flex;justify-content:center}
.claim .inner{max-width:1100px;width:100%;text-align:center}
.claim .reveal{overflow:hidden}
.claim .statement{transform:translateY(105%);transition:transform 1100ms var(--ease)}
.claim.is-in .statement{transform:none}

/* ── Gallery end image: the room, full bleed, same dark-gradient-readable
   treatment the old corridor door used at its own fullscreen end state, now
   a plain static section (no pin, no 3D) since this is the only gallery
   mention on the page. ── */
.gallery-end{position:relative;min-height:100svh;background:var(--band);color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.gallery-end-media{position:absolute;inset:0}
.gallery-end-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.gallery-end-media::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(11,12,16,.08) 0,rgba(11,12,16,.12) 40%,rgba(11,12,16,.82) 100%)}
.gallery-end-copy{position:relative;z-index:2;padding:clamp(48px,8vh,88px) 28px;max-width:620px}
.gallery-end-copy .eyebrow{display:block;margin-bottom:16px;color:rgba(255,255,255,.66)}
.gallery-end-copy h2{margin:0 0 16px;font-size:clamp(1.8rem,4vw,3rem);font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variation-settings:'wdth' 112}
.gallery-end-copy p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6;max-width:34ch}
.gallery-end-copy .btn{margin-top:22px}
.gallery-end-copy .btn:hover{background:#fff;color:var(--ink);gap:16px}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .claim .statement{transform:none}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<!-- @include: nav -->

<main id="main">
<!-- @include: magazine-block -->

<section class="claim rv">
  <div class="inner">
    <div class="reveal"><p class="statement">No algorithm<br>decides<br>what's here.</p></div>
  </div>
</section>

<section class="gallery-end">
  <div class="gallery-end-media">
    <picture>
      <source type="image/avif" srcset="/assets/responsive/room-bloom-960.avif 960w, /assets/responsive/room-bloom-1440.avif 1440w, /assets/responsive/room-bloom-1904.avif 1904w" sizes="100vw">
      <source type="image/webp" srcset="/assets/responsive/room-bloom-960.webp 960w, /assets/responsive/room-bloom-1440.webp 1440w, /assets/responsive/room-bloom-1904.webp 1904w" sizes="100vw">
      <img src="/assets/responsive/room-bloom-1904.jpg" srcset="/assets/responsive/room-bloom-960.jpg 960w, /assets/responsive/room-bloom-1440.jpg 1440w, /assets/responsive/room-bloom-1904.jpg 1904w" sizes="100vw" alt="The Bloom room in the Get Inspired Society gallery" loading="lazy" decoding="async" width="1904" height="964">
    </picture>
  </div>
  <div class="gallery-end-copy rv" data-reveal-group="gallery-end">
    <span class="eyebrow">Exhibition no. 4</span>
    <h2>Walk through<br>Bloom.</h2>
    <p>The fourth issue, hung in a room you can move through.</p>
    <a class="btn" href="/gallery">Enter the room &rarr;</a>
  </div>
</section>
</main>

<!-- @include: footer -->

<script src="/js/motion.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magazine · Get Inspired Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking font load, same pattern as build/pages/submit.html. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap"></noscript>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<!-- @include: analytics -->
<style>
:root{--blue:#0d2ec4;--ink:#0b0c10;--paper:#ffffff;--muted:#5b616b;--line:#e4e6ec;--ease:cubic-bezier(.16,.84,.44,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
/* Fallback metrics copied from Archivo's own hhea table (ascent/descent/line-gap) and from its xAvgCharWidth vs Arial/Liberation Sans (size-adjust), so swapping in the real webfont doesn't reflow the page (CLS). */
@font-face{font-family:'Archivo Fallback';src:local('Arial'),local('Helvetica'),local('Liberation Sans'),local('Helvetica Neue');size-adjust:99.2%;ascent-override:87.8%;descent-override:21%;line-gap-override:0%}
body{font-family:'Archivo','Archivo Fallback',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.statement{font-weight:700;line-height:.94;letter-spacing:-.02em;font-variation-settings:'wdth' 118;font-size:clamp(2.4rem,6.6vw,5.6rem)}

/* statement */
.claim{background:var(--blue);color:#fff;padding:clamp(80px,14vh,170px) 28px;display:flex;justify-content:center;text-align:center}
.claim .inner{max-width:1100px;width:100%;overflow:hidden}
.claim .statement{transform:translateY(105%);transition:transform 1100ms var(--ease)}
.claim.is-in .statement{transform:none}
.claim .note{margin-top:26px;font-size:14px;color:rgba(255,255,255,.72);opacity:0;transition:opacity .8s .5s}
.claim.is-in .note{opacity:1}

.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.is-in{opacity:1;transform:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}.claim .statement{transform:none}.claim .note{opacity:1}
}
</style>
</head>
<body>
<!-- @include: wipe -->
<!-- @include: nav -->

<main id="main">
<!-- @include: magazine-block -->

<section class="claim rv">
  <div class="inner">
    <p class="statement">Every issue<br>starts with<br>a question.</p>
    <p class="note">Free to read. No account, no wall.</p>
  </div>
</section>
</main>

<!-- @include: footer -->

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}})},{threshold:.2});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
</body>
</html>
